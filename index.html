<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>IIT Timetable Hub</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#6366f1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="IIT Timetable">
  <link rel="apple-touch-icon" href="https://cdn-icons-png.flaticon.com/512/2693/2693507.png">

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body { background-color: #0f172a; color: #f8fafc; font-family: system-ui, -apple-system, sans-serif; }
    .glass { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
  </style>
</head>
<body class="pb-16 max-w-md mx-auto min-h-screen border-x border-slate-800">

  <!-- Header -->
  <header class="p-4 glass sticky top-0 z-50 border-b border-slate-700">
    <div class="flex justify-between items-center">
      <div class="flex items-center space-x-3">
        <div class="bg-indigo-600 p-2.5 rounded-2xl text-white shadow-lg shadow-indigo-500/30">
          <i class="fa-solid fa-graduation-cap text-xl"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight" id="headerTitle">IIT Timetable</h1>
          <p class="text-xs text-indigo-400 font-medium" id="headerSub">Select your group below</p>
        </div>
      </div>
      
      <div class="flex items-center space-x-2">
        <button onclick="toggleSettingsModal()" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition" title="Change Group & Electives">
          <i class="fa-solid fa-sliders"></i>
        </button>
        <a href="https://drive.google.com/file/d/1CzULxeSQeasZijoCVXykWQAKuM1UZ_23/view?usp=drive_link" target="_blank" class="bg-slate-800 hover:bg-slate-700 text-slate-300 p-2.5 rounded-xl border border-slate-700 transition" title="Open Google Drive">
          <i class="fa-brands fa-google-drive"></i>
        </a>
        <label class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-3 py-2.5 rounded-xl cursor-pointer flex items-center gap-1.5 font-semibold shadow-lg shadow-indigo-600/30 transition">
          <i class="fa-solid fa-file-arrow-up"></i> Sync
          <input type="file" id="fileInput" accept=".html,.htm" class="hidden">
        </label>
      </div>
    </div>

    <!-- Live Sync Status Banner -->
    <div class="mt-3 pt-2.5 border-t border-slate-700/60 flex justify-between items-center text-[11px]">
      <span class="text-slate-400 flex items-center gap-1.5 font-medium">
        <span class="relative flex h-2 w-2">
          <span class="animate-ping absolute inline-flex h-full w-full rounded-full bg-emerald-400 opacity-75"></span>
          <span class="relative inline-flex rounded-full h-2 w-2 bg-emerald-500"></span>
        </span>
        Timetable Status:
      </span>
      <span id="lastUpdatedBadge" class="font-bold text-emerald-400 bg-emerald-500/10 px-2 py-0.5 rounded-md border border-emerald-500/20">
        Updated just now
      </span>
    </div>
  </header>

  <!-- Day Selector Bar -->
  <div class="p-4 overflow-x-auto flex space-x-2 no-scrollbar" id="dayPicker">
    <button onclick="switchDay('Monday')" id="tab-Monday" class="day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md transition">Mon</button>
    <button onclick="switchDay('Tuesday')" id="tab-Tuesday" class="day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Tue</button>
    <button onclick="switchDay('Wednesday')" id="tab-Wednesday" class="day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Wed</button>
    <button onclick="switchDay('Thursday')" id="tab-Thursday" class="day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Thu</button>
    <button onclick="switchDay('Friday')" id="tab-Friday" class="day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition">Fri</button>
  </div>

  <!-- Schedule List Container -->
  <main class="px-4 space-y-3.5" id="scheduleContainer"></main>

  <!-- Settings / Group Selection Modal -->
  <div id="settingsModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden">
    <div class="glass w-full max-w-sm rounded-3xl p-6 border border-slate-700 space-y-5 shadow-2xl">
      <div class="flex justify-between items-center border-b border-slate-700/60 pb-3">
        <h2 class="text-base font-bold text-white flex items-center gap-2">
          <i class="fa-solid fa-user-gear text-indigo-400"></i> Profile Setup
        </h2>
        <button onclick="toggleSettingsModal()" class="text-slate-400 hover:text-white text-lg"><i class="fa-solid fa-xmark"></i></button>
      </div>

      <!-- Course Stream -->
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Degree Stream</label>
        <div class="grid grid-cols-2 gap-2">
          <button type="button" onclick="setStream('CS')" id="btnStreamCS" class="py-2.5 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-600/30 text-indigo-200">BSc (Hons) CS</button>
          <button type="button" onclick="setStream('SE')" id="btnStreamSE" class="py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-400">BEng (Hons) SE</button>
        </div>
      </div>

      <!-- Group Picker -->
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Allocated Group</label>
        <select id="groupSelect" onchange="saveUserProfile()" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-3 py-2.5 text-xs text-slate-200 font-semibold focus:outline-none focus:border-indigo-500"></select>
      </div>

      <!-- Optional Extra Modules -->
      <div>
        <label class="block text-xs font-bold text-slate-400 uppercase tracking-wider mb-2">Additional Electives</label>
        <div class="space-y-2 text-xs">
          <label class="flex items-center space-x-3 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer">
            <input type="checkbox" id="chkRobotics" onchange="saveUserProfile()" class="rounded border-slate-700 text-indigo-600 focus:ring-0">
            <span class="text-slate-200 font-medium">🤖 Robotic Principles & Sensors</span>
          </label>
          <label class="flex items-center space-x-3 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer">
            <input type="checkbox" id="chkAdvancedClient" onchange="saveUserProfile()" class="rounded border-slate-700 text-indigo-600 focus:ring-0">
            <span class="text-slate-200 font-medium">💻 Advanced Client-side Dev</span>
          </label>
          <label class="flex items-center space-x-3 bg-slate-800/60 p-2.5 rounded-xl border border-slate-700/60 cursor-pointer">
            <input type="checkbox" id="chkHCI" onchange="saveUserProfile()" class="rounded border-slate-700 text-indigo-600 focus:ring-0">
            <span class="text-slate-200 font-medium">🎨 HCI & UX</span>
          </label>
        </div>
      </div>

      <button onclick="toggleSettingsModal()" class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-bold text-xs py-3 rounded-xl shadow-lg shadow-indigo-600/30 transition">
        Apply Settings
      </button>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('/sw.js').catch(err => console.log('SW reg error: ', err));
      });
    }

    const MODULE_DB = {
      '5COSC019C': { name: 'Object Oriented Programming', leader: 'Mr. Guhanathan Poravi', icon: 'fa-code', border: 'border-emerald-500', badge: 'bg-emerald-500/20 text-emerald-300' },
      '5COSC020C': { name: 'Database Systems', leader: 'Ms. Janani Harischandra', icon: 'fa-database', border: 'border-cyan-500', badge: 'bg-cyan-500/20 text-cyan-300' },
      '5COSC021C': { name: 'Agile Team Project', leader: 'Mr. Banu Athuruliya', icon: 'fa-users-gear', border: 'border-purple-500', badge: 'bg-purple-500/20 text-purple-300' },
      '5COSC999C': { name: 'Professional Development', leader: 'Ms. Imani Randuli', icon: 'fa-user-tie', border: 'border-amber-500', badge: 'bg-amber-500/20 text-amber-300' },
      '5ELEN018C': { name: 'Robotic Principles', leader: 'Dr. Sahan Priyanayana', icon: 'fa-robot', border: 'border-rose-500', badge: 'bg-rose-500/20 text-rose-300' },
      '5ELEN021C': { name: 'Sensors & Signals', leader: 'Dr. Sahan Priyanayana', icon: 'fa-radio', border: 'border-red-500', badge: 'bg-red-500/20 text-red-300' },
      '5COSC026C': { name: 'Advanced Client-side Dev', leader: 'Ms. Nilakshi Nonis', icon: 'fa-desktop', border: 'border-blue-500', badge: 'bg-blue-500/20 text-blue-300' },
      '5COSC025C': { name: 'HCI & User Experience', leader: 'Mr. Damantha Silva', icon: 'fa-palette', border: 'border-pink-500', badge: 'bg-pink-500/20 text-pink-300' },
      '5SENG007C': { name: 'Software Engineering Principles', leader: 'Vishm', icon: 'fa-layer-group', border: 'border-indigo-500', badge: 'bg-indigo-500/20 text-indigo-300' }
    };

    const LECTURER_DB = {
      'GUG': 'Mr. Guhanathan Poravi', 'JNI': 'Ms. Janani Harischandra', 'BNU': 'Mr. Banu Athuruliya',
      'IMA': 'Ms. Imani Randuli', 'SAHP': 'Dr. Sahan Priyanayana', 'NILAN': 'Ms. Nilakshi Nonis',
      'DMS': 'Mr. Damantha Silva', 'PUM': 'Mr. Pumudu Fernando', 'MANU': 'Mr. Manul Singh'
    };

    let userProfile = { stream: 'CS', group: 'L5 CS -G13', robotics: true, clientSide: false, hci: false };
    let activeDay = 'Monday';

    document.addEventListener('DOMContentLoaded', () => {
      const saved = localStorage.getItem('iitUserProfile');
      if (saved) { userProfile = JSON.parse(saved); }
      populateGroupSelect();
      updateHeader();
      updateSyncTimeDisplay();
      renderSchedule();

      setInterval(updateSyncTimeDisplay, 30000);
    });

    // CONTROLLER: Parsing logic for uploaded FET HTML files
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(evt) {
        parseUploadedFETHTML(evt.target.result);
      };
      reader.readAsText(file);
    });

    function parseUploadedFETHTML(htmlText) {
      try {
        const parser = new DOMParser();
        const doc = parser.parseFromString(htmlText, 'text/html');
        const tables = doc.querySelectorAll('table');
        const parsedData = {};

        tables.forEach(table => {
          const caption = table.querySelector('caption');
          if (!caption) return;
          const groupName = caption.textContent.replace('Informatics Institute of Technology', '').trim();
          if (!groupName) return;

          const days = ['Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday'];
          const rows = table.querySelectorAll('tr');
          const groupSched = { 'Monday': [], 'Tuesday': [], 'Wednesday': [], 'Thursday': [], 'Friday': [] };

          rows.forEach(row => {
            const timeTh = row.querySelector('th.yAxis');
            if (!timeTh) return;
            const timeSlot = timeTh.textContent.trim();
            const tds = row.querySelectorAll('td');

            tds.forEach((td, dayIdx) => {
              if (dayIdx >= 5) return;
              const text = td.textContent.trim();
              if (text && text !== '---') {
                const dayName = days[dayIdx];
                const codeMatch = text.match(/([0-9][A-Z0-9]{8,9})/);
                const code = codeMatch ? codeMatch[1] : 'OTHER';

                let room = 'Campus';
                if (text.includes('ONLINE')) room = 'ONLINE';
                else {
                  const roomMatch = text.match(/SP\s*-\s*[A-Z0-9]+/i);
                  if (roomMatch) room = roomMatch[0];
                }

                let type = 'Session';
                if (text.includes('LEC')) type = 'Lecture';
                else if (text.includes('TUT')) type = 'Tutorial';
                else if (text.toLowerCase().includes('feedback')) type = 'Feedback';

                const timeMatch = text.match(/\[([0-9]{1,2}\.[0-9]{2}(?:am\vert{}pm)?\s*-\s*[0-9]{1,2}\.[0-9]{2}(?:am\vert{}pm)?)\]/i);
                const timeRange = timeMatch ? timeMatch[1] : timeSlot;

                const lines = text.split('\n').map(l => l.trim()).filter(l => l);
                let staff = 'TBA';
                if (lines.length >= 2) {
                  staff = lines[lines.length - 2];
                  if (staff.startsWith('SP -') || staff.includes('ONLINE')) {
                    staff = lines[lines.length - 3] || 'TBA';
                  }
                }

                groupSched[dayName].push({
                  time: timeRange,
                  code: code,
                  type: type,
                  room: room,
                  staff: staff
                });
              }
            });
          });

          parsedData[groupName] = groupSched;
        });

        localStorage.setItem('parsedFETData', JSON.stringify(parsedData));
        const now = new Date().toISOString();
        localStorage.setItem('iitLastSyncTime', now);
        updateSyncTimeDisplay();
        alert('New timetable synced successfully!');
        renderSchedule();
      } catch (err) {
        alert('Error parsing timetable: ' + err.message);
      }
    }

    function getRelativeTimeString(timestamp) {
      if (!timestamp) return 'Updated recently';
      const now = new Date();
      const past = new Date(timestamp);
      const diffInSeconds = Math.floor((now - past) / 1000);

      if (diffInSeconds < 60) return 'Updated just now';
      const diffInMinutes = Math.floor(diffInSeconds / 60);
      if (diffInMinutes < 60) return `Updated ${diffInMinutes} min${diffInMinutes > 1 ? 's' : ''} ago`;
      const diffInHours = Math.floor(diffInMinutes / 60);
      if (diffInHours < 24) return `Updated ${diffInHours} hour${diffInHours > 1 ? 's' : ''} ago`;
      const diffInDays = Math.floor(diffInHours / 24);
      return `Updated ${diffInDays} day${diffInDays > 1 ? 's' : ''} ago`;
    }

    function updateSyncTimeDisplay() {
      const lastSync = localStorage.getItem('iitLastSyncTime');
      document.getElementById('lastUpdatedBadge').innerText = getRelativeTimeString(lastSync);
    }

    function toggleSettingsModal() {
      document.getElementById('settingsModal').classList.toggle('hidden');
    }

    function setStream(stream) {
      userProfile.stream = stream;
      userProfile.group = stream === 'CS' ? 'L5 CS -G13' : 'L5 SE -G1';
      document.getElementById('btnStreamCS').className = stream === 'CS' ? "py-2.5 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-600/30 text-indigo-200" : "py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-400";
      document.getElementById('btnStreamSE').className = stream === 'SE' ? "py-2.5 rounded-xl font-bold text-xs border border-indigo-500 bg-indigo-600/30 text-indigo-200" : "py-2.5 rounded-xl font-bold text-xs border border-slate-700 bg-slate-800 text-slate-400";
      populateGroupSelect();
      saveUserProfile();
    }

    function populateGroupSelect() {
      const sel = document.getElementById('groupSelect');
      sel.innerHTML = '';
      const count = userProfile.stream === 'CS' ? 16 : 4;
      const prefix = userProfile.stream === 'CS' ? 'L5 CS -G' : 'L5 SE -G';
      
      for(let i=1; i<=count; i++) {
        const val = `${prefix}${i}`;
        const opt = document.createElement('option');
        opt.value = val;
        opt.innerText = val;
        if(val === userProfile.group) opt.selected = true;
        sel.appendChild(opt);
      }

      document.getElementById('chkRobotics').checked = userProfile.robotics;
      document.getElementById('chkAdvancedClient').checked = userProfile.clientSide;
      document.getElementById('chkHCI').checked = userProfile.hci;
    }

    function saveUserProfile() {
      userProfile.group = document.getElementById('groupSelect').value;
      userProfile.robotics = document.getElementById('chkRobotics').checked;
      userProfile.clientSide = document.getElementById('chkAdvancedClient').checked;
      userProfile.hci = document.getElementById('chkHCI').checked;
      localStorage.setItem('iitUserProfile', JSON.stringify(userProfile));
      updateHeader();
      renderSchedule();
    }

    function updateHeader() {
      document.getElementById('headerTitle').innerText = userProfile.group;
      document.getElementById('headerSub').innerText = `${userProfile.stream} Stream • Timetable`;
    }

    function switchDay(day) {
      activeDay = day;
      document.querySelectorAll('.day-tab').forEach(btn => {
        btn.className = "day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-slate-800 text-slate-400 hover:bg-slate-700 transition";
      });
      document.getElementById(`tab-${day}`).className = "day-tab px-4 py-2.5 rounded-xl text-xs font-bold bg-indigo-600 text-white shadow-md transition";
      renderSchedule();
    }

    function decodeStaff(staffStr) {
      if(!staffStr) return 'TBA';
      return staffStr.split(',').map(s => LECTURER_DB[s.trim()] || s.trim()).join(', ');
    }

    function renderSchedule() {
      const container = document.getElementById('scheduleContainer');
      const parsedData = JSON.parse(localStorage.getItem('parsedFETData') || '{}');
      
      let items = [];
      const currentGroupData = parsedData[userProfile.group];

      if (currentGroupData && currentGroupData[activeDay]) {
        items = [...currentGroupData[activeDay]];
      } else {
        // Fallback default sample data
        items = [
          { day: 'Monday', time: '08:30 AM - 10:30 AM', code: '5COSC019C', type: 'PRO TUT', room: 'SP - 4LB', staff: 'SUB, NIYB' },
          { day: 'Monday', time: '10:30 AM - 12:30 PM', code: '5COSC020C', type: 'TUT', room: 'SP - 5LD', staff: 'MERA, NILAN' },
          { day: 'Monday', time: '10:30 AM - 12:30 PM', code: '5ELEN018C', type: 'LEC', room: 'SP - 3LC', staff: 'SAHP' },
          { day: 'Monday', time: '01:30 PM - 03:30 PM', code: '5COSC019C', type: 'DES LEC', room: 'SP - 6LA', staff: 'PJN' },
          { day: 'Monday', time: '03:30 PM - 05:30 PM', code: '5ELEN021C', type: 'TUT', room: 'SP - 3LB', staff: 'SAHP' },
          { day: 'Tuesday', time: '08:30 AM - 10:30 AM', code: '5ELEN021C', type: 'LEC', room: 'SP - 3LB', staff: 'SAHP' },
          { day: 'Wednesday', time: '08:30 AM - 10:30 AM', code: '5COSC020C', type: 'LEC', room: 'SP - 7LA', staff: 'SANJ' },
          { day: 'Wednesday', time: '10:30 AM - 12:30 PM', code: '5COSC999C', type: 'TUT', room: 'SP - 4LD', staff: 'IMA' },
          { day: 'Wednesday', time: '03:30 PM - 05:30 PM', code: '5ELEN018C', type: 'TUT', room: 'SP - 3LD', staff: 'SAHP, JAPA' },
          { day: 'Thursday', time: '08:30 AM - 10:30 AM', code: '5COSC021C', type: 'LEC [ONLINE]', room: 'ONLINE', staff: 'BNU, KUS, SUR, MANU' },
          { day: 'Thursday', time: '10:30 AM - 12:30 PM', code: '5COSC021C', type: 'Supervisor Feedback', room: 'SP - Campus', staff: 'Module Team' },
          { day: 'Thursday', time: '01:30 PM - 05:30 PM', code: '5COSC021C', type: 'Module Feedback', room: 'SP - 3LA', staff: 'IMAS, VINR, HARR' },
          { day: 'Friday', time: '08:30 AM - 10:30 AM', code: '5COSC999C', type: 'LEC', room: 'SP - 5LA', staff: 'CHAR' },
          { day: 'Friday', time: '10:30 AM - 12:30 PM', code: '5COSC019C', type: 'PRO LEC', room: 'SP - 4LA', staff: 'SALIP' }
        ].filter(x => x.day === activeDay);
      }

      // Merge robotics sessions if toggle is enabled
      if (userProfile.robotics && userProfile.group !== 'L5 CS -G9' && userProfile.group !== 'L5 CS -G16') {
        if (activeDay === 'Monday') {
          items.push({ time: '10:30 AM - 12:30 PM', code: '5ELEN018C', type: 'LEC', room: 'SP - 3LC', staff: 'SAHP' });
          items.push({ time: '03:30 PM - 05:30 PM', code: '5ELEN021C', type: 'TUT', room: 'SP - 3LB', staff: 'SAHP' });
        } else if (activeDay === 'Tuesday') {
          items.push({ time: '08:30 AM - 10:30 AM', code: '5ELEN021C', type: 'LEC', room: 'SP - 3LB', staff: 'SAHP' });
        } else if (activeDay === 'Wednesday') {
          items.push({ time: '03:30 PM - 05:30 PM', code: '5ELEN018C', type: 'TUT', room: 'SP - 3LD', staff: 'SAHP, JAPA' });
        }
      }

      if(items.length === 0) {
        container.innerHTML = `
          <div class="text-center py-16 text-slate-500 glass rounded-3xl">
            <i class="fa-solid fa-mug-hot text-4xl mb-3 text-slate-600"></i>
            <p class="text-sm font-semibold">No lectures scheduled for ${activeDay}!</p>
          </div>`;
        return;
      }

      container.innerHTML = items.map(item => {
        const meta = MODULE_DB[item.code] || { name: item.code, leader: 'Lecturer', icon: 'fa-book', border: 'border-indigo-500', badge: 'bg-indigo-500/20 text-indigo-300' };
        return `
          <div class="glass p-4 rounded-2xl border-l-4 ${meta.border} shadow-lg transition hover:translate-y-[-2px]">
            <div class="flex justify-between items-start gap-2">
              <span class="${meta.badge} text-[10px] px-2.5 py-1 rounded-full font-bold uppercase tracking-wider">${item.time}</span>
              <span class="bg-slate-800 text-slate-300 text-[11px] font-semibold px-2.5 py-1 rounded-lg border border-slate-700">
                <i class="fa-solid fa-location-dot text-indigo-400 mr-1"></i>${item.room}
              </span>
            </div>
            
            <h3 class="text-sm font-bold mt-2.5 text-slate-100 flex items-center gap-2">
              <i class="fa-solid ${meta.icon} text-indigo-400"></i> ${meta.name}
            </h3>
            
            <div class="mt-2.5 pt-2.5 border-t border-slate-700/50 flex justify-between items-center text-xs text-slate-400">
              <span class="truncate max-w-[200px]"><i class="fa-solid fa-chalkboard-user mr-1 text-slate-500"></i> ${decodeStaff(item.staff)}</span>
              <span class="text-[10px] font-bold uppercase px-2 py-0.5 rounded bg-slate-800 text-slate-400 border border-slate-700">${item.type}</span>
            </div>
          </div>
        `;
      }).join('');
    }
  </script>
</body>
</html>
